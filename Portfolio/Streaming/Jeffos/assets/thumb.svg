<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150d33"/>
      <stop offset="0.42" stop-color="#241452"/>
      <stop offset="0.66" stop-color="#4a1f63"/>
      <stop offset="1" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="1" stop-color="#ff5ea8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df0ff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="500" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="400" cy="205" r="120" fill="url(#sun)"/>
    <g fill="#241452" opacity="0.75">
      <rect x="270" y="250" width="260" height="9"/>
      <rect x="270" y="268" width="260" height="12"/>
      <rect x="270" y="290" width="260" height="16"/>
    </g>

    <!-- ridges -->
    <path d="M-20 330 L60 268 L130 312 L210 246 L300 300 L380 240 L470 296 L560 252 L650 310 L740 264 L820 330 L820 360 L-20 360 Z" fill="#1b0f3a"/>
    <path d="M-20 340 L80 296 L170 330 L260 288 L350 332 L450 292 L540 336 L640 296 L740 334 L820 300 L820 366 L-20 366 Z" fill="#2a1758" opacity="0.8"/>

    <!-- perspective grid -->
    <g stroke="#7df0ff" stroke-width="1.6" opacity="0.45">
      <path d="M0 500 L360 360"/><path d="M110 500 L385 360"/><path d="M240 500 L400 360"/>
      <path d="M400 500 L400 360"/><path d="M560 500 L415 360"/><path d="M690 500 L440 360"/>
      <path d="M800 500 L465 360"/>
      <path d="M-20 372 H820"/><path d="M-20 390 H820"/><path d="M-20 416 H820"/>
      <path d="M-20 452 H820"/><path d="M-20 500 H820"/>
    </g>
    <rect y="330" width="800" height="170" fill="#7df0ff" opacity="0.06"/>

    <!-- live pill -->
    <rect x="30" y="30" width="86" height="30" rx="8" fill="#ff3b5c"/>
    <circle cx="49" cy="45" r="5" fill="#fff"/>
    <text x="62" y="51" font-family="'Chakra Petch',system-ui,sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">LIVE</text>

    <!-- viewer chip -->
    <rect x="126" y="30" width="150" height="30" rx="8" fill="#060914" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="142" y="51" font-family="'Chakra Petch',system-ui,sans-serif" font-size="15" font-weight="600" fill="#eaf0ff">12,481 watching</text>

    <!-- chat panel -->
    <rect x="576" y="86" width="196" height="300" rx="14" fill="#0c1122" fill-opacity="0.9" stroke="#7df0ff" stroke-opacity="0.28"/>
    <text x="594" y="112" font-family="'Chakra Petch',system-ui,sans-serif" font-size="14" font-weight="700" fill="#eaf0ff" letter-spacing="1.4">STREAM CHAT</text>
    <line x1="576" y1="124" x2="772" y2="124" stroke="#7df0ff" stroke-opacity="0.2"/>
    <g font-family="Inter,system-ui,sans-serif" font-size="12">
      <text x="594" y="148" fill="#7df0ff">ZEROFRAME<tspan fill="#8e9ac4">: GG</tspan></text>
      <text x="594" y="170" fill="#ff5ea8">mochi_wav<tspan fill="#8e9ac4">: no way that landed</tspan></text>
      <text x="594" y="192" fill="#5ff2c4">bitrot<tspan fill="#8e9ac4">: W stream</tspan></text>
      <text x="594" y="214" fill="#a06bff">Halcyon_TV<tspan fill="#8e9ac4">: chat we're back</tspan></text>
      <text x="594" y="236" fill="#ffd36e">OrbitDecay<tspan fill="#8e9ac4">: goal almost there</tspan></text>
    </g>
    <rect x="590" y="252" width="168" height="46" rx="10" fill="#a06bff" fill-opacity="0.22" stroke="#7df0ff" stroke-opacity="0.5"/>
    <circle cx="612" cy="275" r="13" fill="#a06bff"/>
    <ellipse cx="612" cy="275" rx="17" ry="5" fill="none" stroke="#ffd1f5" stroke-width="1.6" transform="rotate(-22 612 275)"/>
    <text x="634" y="272" font-family="'Chakra Petch',system-ui,sans-serif" font-size="12" font-weight="700" fill="#eaf0ff">Galaxy Titan</text>
    <text x="634" y="287" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#8e9ac4">$150 · 100% to JEFFOS</text>
    <rect x="590" y="312" width="120" height="28" rx="9" fill="#04070f" stroke="#7df0ff" stroke-opacity="0.25"/>
    <text x="602" y="331" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#5f6c94">Send a message…</text>
    <rect x="718" y="312" width="42" height="28" rx="9" fill="url(#ink)"/>

    <!-- gift alert -->
    <rect x="176" y="176" width="252" height="70" rx="16" fill="#080c1a" fill-opacity="0.9" stroke="#7df0ff" stroke-opacity="0.55"/>
    <path d="M212 194 Q228 208 226 224 Q224 238 212 244 Q200 238 198 224 Q196 208 212 194 Z" fill="#ff7a3c"/>
    <path d="M198 214 Q186 218 188 230 Q196 226 200 220 Z" fill="#ffd66e"/>
    <path d="M226 214 Q238 218 236 230 Q228 226 224 220 Z" fill="#ffd66e"/>
    <text x="250" y="210" font-family="'Chakra Petch',system-ui,sans-serif" font-size="17" font-weight="700" fill="#eaf0ff">Chrome Phoenix!</text>
    <text x="250" y="230" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#8e9ac4">$35.00 · 100% to the streamer</text>

    <!-- name plate -->
    <text x="30" y="452" font-family="'Chakra Petch',system-ui,sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="5">JEFFOS</text>
    <rect x="32" y="466" width="150" height="4" rx="2" fill="url(#ink)"/>
  </g>
</svg>
