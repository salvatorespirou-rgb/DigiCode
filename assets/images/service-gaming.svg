<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gamingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gamingGradSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="gamingGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- glow layer -->
  <polygon points="90,190 140,140 260,140 310,190 330,240 300,285 255,255 245,235 155,235 145,255 100,285 70,240"
    fill="url(#gamingGradSoft)" opacity="0.45" filter="url(#gamingGlow)"/>

  <!-- controller body -->
  <polygon points="90,190 140,140 260,140 310,190 330,240 300,285 255,255 245,235 155,235 145,255 100,285 70,240"
    fill="url(#gamingGrad)" stroke="#1a0a2e" stroke-width="2"/>

  <!-- glossy top highlight -->
  <polyline points="140,140 175,116 225,116 260,140" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>

  <!-- d-pad -->
  <rect x="128" y="181" width="44" height="14" rx="3" fill="#0f0620"/>
  <rect x="143" y="166" width="14" height="44" rx="3" fill="#0f0620"/>

  <!-- action buttons -->
  <g fill="#0f0620">
    <rect x="248" y="168" width="18" height="18" rx="4" transform="rotate(45 257 177)"/>
    <rect x="276" y="196" width="18" height="18" rx="4" transform="rotate(45 285 205)"/>
    <rect x="248" y="224" width="18" height="18" rx="4" transform="rotate(45 257 233)"/>
    <rect x="220" y="196" width="18" height="18" rx="4" transform="rotate(45 229 205)"/>
  </g>

  <!-- shoulder accents -->
  <rect x="118" y="118" width="46" height="10" rx="5" fill="#c084fc"/>
  <rect x="236" y="118" width="46" height="10" rx="5" fill="#60a5fa"/>
</svg>
